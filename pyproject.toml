[project]
name = "rb2db"
version = "1.3.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.1",
    "pdfplumber>=0.11.9",
    "pyinstaller>=6.19.0",
    "pymupdf>=1.27.1",
    "pyside6==6.7.3",
    "scipy>=1.17.1",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "lap>=0.5.12",
    "ultralytics>=8.4.19",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
