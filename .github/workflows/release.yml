name: Auto Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: extract_version
        shell: bash
        run: |
          VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build with PyInstaller
        run: uv run pyinstaller main_production.spec -y

      - name: Compress with 7z
        run: 7z a ResultsBook2DB_v${{ steps.extract_version.outputs.version }}_win64.7z ./dist/ResultsBook2DB/

      - name: Create Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.extract_version.outputs.tag }}"
          ASSET="ResultsBook2DB_v${{ steps.extract_version.outputs.version }}_win64.7z"

          if ! git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes \
              "$ASSET"
          else
            echo "Release $TAG already exists. Skipping."
          fi
