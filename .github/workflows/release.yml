name: Auto Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check if version changed
        id: check
        shell: bash
        run: |
          CURRENT=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' pyproject.toml)
          PREVIOUS=$(git show HEAD~1:pyproject.toml | sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p')
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      tag: ${{ steps.extract_version.outputs.tag }}
      asset: ${{ steps.extract_version.outputs.asset }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: extract_version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' pyproject.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "asset=ResultsBook2DB_v${VERSION}_win64.7z" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build with PyInstaller
        run: uv run pyinstaller main_production.spec -y

      - name: Compress with 7z
        run: 7z a ${{ steps.extract_version.outputs.asset }} ./dist/ResultsBook2DB/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.extract_version.outputs.asset }}
          path: ${{ steps.extract_version.outputs.asset }}
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.asset }}

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)

          # GitHub自動生成ノート（PRタイトル・説明）
          if [ -z "$PREV_TAG" ]; then
            PR_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" --jq '.body') || PR_NOTES=""
          else
            PR_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" -f previous_tag_name="$PREV_TAG" --jq '.body') || PR_NOTES=""
          fi

          # 直コミットからfeat/fix/perfを抽出
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges \
              | grep -E "^(feat|fix|perf)(\(.+\))?:" | sed 's/^/- /' | sed 'G') || true
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"%s" --no-merges \
              | grep -E "^(feat|fix|perf)(\(.+\))?:" | sed 's/^/- /' | sed 'G') || true
          fi

          # PRノートに直コミット分を追記
          if [ -n "$COMMITS" ]; then
            NOTES=$(printf "%s\n\n## Changes\n%s" "$PR_NOTES" "$COMMITS")
          else
            NOTES="$PR_NOTES"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          ASSET="${{ needs.build.outputs.asset }}"

          if ! git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes "${{ steps.notes.outputs.notes }}" \
              "$ASSET"
          else
            echo "Release $TAG already exists. Skipping."
          fi
