name: Auto Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: extract_version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' pyproject.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build with PyInstaller
        run: uv run pyinstaller main_production.spec -y

      - name: Compress with 7z
        run: 7z a ResultsBook2DB_v${{ steps.extract_version.outputs.version }}_win64.7z ./dist/ResultsBook2DB/

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.extract_version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)

          # GitHub自動生成ノート（PRタイトル・説明）
          if [ -z "$PREV_TAG" ]; then
            PR_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" --jq '.body')
          else
            PR_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" -f previous_tag_name="$PREV_TAG" --jq '.body')
          fi

          # 直コミットからfeat/fix/perfを抽出
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges \
              | grep -E "^(feat|fix|perf)(\(.+\))?:" | sed 's/^/- /')
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"%s" --no-merges \
              | grep -E "^(feat|fix|perf)(\(.+\))?:" | sed 's/^/- /')
          fi

          # PRノートに直コミット分を追記
          if [ -n "$COMMITS" ]; then
            NOTES=$(printf "%s\n\n## その他の変更\n%s" "$PR_NOTES" "$COMMITS")
          else
            NOTES="$PR_NOTES"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.extract_version.outputs.tag }}"
          ASSET="ResultsBook2DB_v${{ steps.extract_version.outputs.version }}_win64.7z"

          if ! git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes "${{ steps.notes.outputs.notes }}" \
              "$ASSET"
          else
            echo "Release $TAG already exists. Skipping."
          fi
